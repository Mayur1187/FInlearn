<!DOCTYPE html>
<html>
<head>
    <title>FinLite</title>

    <style>
    body {
        margin: 0;
        font-family: Arial;
        display: flex;
        background: #f5f5f5;
    }

    /* Sidebar */
    .sidebar {
        width: 200px;
        background: #111;
        color: white;
        height: 100vh;
        padding: 20px;
    }

    .sidebar a {
        display: block;
        color: white;
        margin: 10px 0;
        text-decoration: none;
    }

    /* Main */
    .main {
        flex: 1;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
    }

    th {
        background: blue;
        color: white;
    }

    th, td {
        padding: 10px;
        text-align: center;
    }

    .chart-box {
        height: 400px;
    }
    </style>
</head>

<body>

<div class="sidebar">
    <h3>📊 FinLite</h3>
    <a href="/dashboard">Dashboard</a>
    <a href="/market">Market</a>
</div>

<div class="main">
    {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}

</body>
</html>
